<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cameron Loi | Nanotechnology Engineer</title>
<meta name="description" content="Portfolio of Cameron Loi: silicon design, cleanroom fabrication and embedded hardware.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="images/camel.png" type="image/png">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a class="brand" href="#" aria-label="Home"><img src="images/camel.png" alt="" width="22" height="22"><b id="brand-name"></b></a>
    <div class="nav">
      <nav class="nav-links">
        <button class="active" id="to-wafer">Wafer Explorer</button>
        <button class="link" data-open="contact">Contact</button>
      </nav>
    </div>
  </div>
</header>

<main class="main">
  <div class="title">
    <div class="portrait"><img id="hero-photo" src="images/profile.svg" alt="Portrait of Cameron Loi" width="130" height="130"></div>
    <h1 id="hero-name"></h1>
    <h2 id="hero-headline"></h2>
    <p id="hero-summary"></p>
  </div>

  <div class="controls" id="controls">
    <div class="deck">
      <section class="deck-sec deck-wafer">
        <p class="deck-label">Wafer</p>
        <div class="dock" id="dock"><div class="cassette" id="tabs" role="group" aria-label="Wafer"></div></div>
      </section>
      <section class="deck-sec deck-obj scope nudge" id="scope">
        <p class="deck-label">Objective</p>
        <div class="turret" role="group" aria-label="Magnification">
          <button class="scope-btn on" data-zoom="0" aria-pressed="true"><i class="lens"></i><span>1.25&times;</span></button>
          <button class="scope-btn" data-zoom="1" aria-pressed="false"><i class="lens"></i><span>5&times;</span></button>
        </div>
      </section>
    </div>
    <button type="button" class="scope-hint" id="scope-hint"></button>
  </div>

  <div class="stage" id="stage">
    <div class="halo" aria-hidden="true"></div>
    <div class="viewport" id="viewport">
      <div class="flipper" id="flipper">
        <div class="wafer-rim" id="rim">
          <div class="wafer">
            <div id="layers"></div>
            <div class="grain"></div>
            <div class="wafer-edge"></div>
            <div class="grid"><div class="grid-inner" id="grid"></div></div>
            <div class="wafer-notch"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="eyepiece" aria-hidden="true">
      <span class="hud">5X ZOOM</span>
    </div>

  </div>

</main>

<div class="overlay" id="project" role="dialog" aria-modal="true" aria-labelledby="p-title">
  <div class="card card-project">
    <div class="card-head">
      <div><h2 id="p-title"></h2><p id="p-meta"></p></div>
      <button class="close" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="card-body">
      <div class="photo" id="p-photo"></div>
      <div class="desc rich" id="p-desc"></div>
      <div id="p-fields">
        <div class="field"><h3>What</h3><div class="rich" id="p-what"></div></div>
        <div class="field"><h3>How</h3><div class="rich" id="p-how"></div></div>
        <div class="field"><h3>Why</h3><div class="rich" id="p-why"></div></div>
      </div>
      <div class="field" id="p-tags-wrap"><h3 id="p-tags-title">Skills used</h3><div class="tags" id="p-tags"></div></div>
    </div>
    <div class="card-foot">
      <button class="btn" data-close>Done Inspecting <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5L20 7"/></svg></button>
    </div>
  </div>
</div>

<div class="overlay" id="contact" role="dialog" aria-modal="true" aria-labelledby="c-title">
  <div class="card card-contact">
    <div class="contact-head">
      <h3 id="c-title">Let's get in touch!</h3>
      <button class="close" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="contact-list">
      <button class="contact-row" id="email-row">
        <span class="contact-main">
          <span class="contact-icon"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span>
          <span><span class="contact-label" id="email-label">Email</span><span class="contact-value" id="email-value"></span></span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <a class="contact-row" id="linkedin-row" target="_blank" rel="noopener noreferrer">
        <span class="contact-main">
          <span class="contact-icon in">in</span>
          <span><span class="contact-label">LinkedIn</span><span class="contact-value" id="linkedin-value"></span></span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
    <div class="contact-foot"><button class="btn" data-close>Done</button></div>
  </div>
</div>

<script src="data.js?v=4"></script>
<script src="script.js?v=4"></script>
</body>
</html>
